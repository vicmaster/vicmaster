name: Latest blog posts

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://victorvelazquez.dev/rss.xml"
          max_post_count: 5
          template: "- [$title]($url) · $date $newline"
          date_format: "UTC:yyyy-mm-dd"
          commit_message: "Update latest blog posts"
